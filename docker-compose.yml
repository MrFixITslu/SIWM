services:
  # Frontend - nginx serving the built React app, proxying /api/ to backend.
  # On proxy_network so Nginx Proxy Manager can reach it by container name
  # (siwm-frontend-1) over the Docker network - no host port strictly
  # required for that, but we also publish 3060 for direct IP:port access.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3060:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
      - proxy_network

  # Backend API - internal only, never touches proxy_network. Only
  # reachable from frontend/postgres over the internal network.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - postgres
    networks:
      - internal
    restart: unless-stopped

  # Postgres - dedicated to SIWM, internal only, no host port published.
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/create_system_settings_table.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  proxy_network:
    external: true
