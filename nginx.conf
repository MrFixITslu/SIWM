worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # Static assets
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Proxy API calls to the backend service on the internal Docker network.
    # location matches "/api/" and proxy_pass also ends in "/api/", so the
    # matched prefix is preserved -> /api/v1/xyz forwards to backend:4000/api/v1/xyz
    location /api/ {
      proxy_pass http://backend:4000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - client-side routing
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
