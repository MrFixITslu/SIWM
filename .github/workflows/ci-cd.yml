name: V79 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v79-ci-cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend, backend, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_vision79_siwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_vision79_siwm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Validate backend
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: test_vision79_siwm
          GEMINI_API_KEY: ci-placeholder
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test

      - name: Verify frontend Docker image
        run: docker build --tag siwm-ci .

      - name: Create delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=backend/node_modules --exclude='*.tar.gz' \
              -czf "${RUNNER_TEMP}/SIWM-${GITHUB_SHA::12}.tar.gz" .

      - name: Upload delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 14

  deliver-container:
    name: Publish frontend Docker image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish to GHCR
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
